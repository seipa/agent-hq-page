name: Nostr Relay Audit
# Misst, welche der von echten Nostr-Nutzern beworbenen Relays tatsaechlich
# erreichbar sind und Events ausliefern. Laeuft auf dem GitHub-Runner, weil
# die Agent-Sandbox hinter einem HTTP-Proxy sitzt, der nicht erreichbare und
# geblockte Hosts ununterscheidbar als 502 zurueckgibt.
# Ergebnis: data/nostr/relay-audit.json + .csv, data/nostr/relay-lists.json

on:
  schedule:
    - cron: "43 3 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/relay-audit.yml"
      - "scripts/relay_audit.py"
      - ".relay-trigger"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: relay-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet websockets

      # Selbstberichtend: Ergebnis UND Fehlerlog landen immer im Repo, weil
      # die Agent-Sessions die Actions-Logs nicht lesen koennen (API 403).
      - name: Run relay audit
        run: |
          mkdir -p data/nostr
          echo "started=$(date -u +%FT%TZ) event=${GITHUB_EVENT_NAME} sha=${GITHUB_SHA::7}" > data/nostr/last-run.log
          set +e
          timeout 18m python scripts/relay_audit.py > data/nostr/last-summary.json 2>> data/nostr/last-run.log
          rc=$?
          echo "audit_exit=$rc finished=$(date -u +%FT%TZ)" >> data/nostr/last-run.log
          if [ "$rc" -eq 0 ]; then
            python scripts/render_relay_audit.py >> data/nostr/last-run.log 2>&1 \
              || echo "render_failed" >> data/nostr/last-run.log
          fi

      # if: always() + pull --rebase: die Mirror-Workflows im selben Repo
      # pushen waehrend der ~10-min-Messung — ohne Rebase scheitert der Push
      # (non-fast-forward) und der ganze Lauf verschwindet spurlos.
      - name: Commit results
        if: always()
        run: |
          set -euo pipefail
          git config user.name "agent-hq relay audit"
          git config user.email "actions@github.com"
          git add -A data/nostr
          git add relay-audit.html 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "keine Aenderung"
          else
            git commit -m "relay-audit: Lauf $(date -u +%FT%TZ)"
            for i in 1 2 3; do
              git push && break
              git pull --rebase origin main
            done
          fi
